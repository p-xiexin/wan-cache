defaults:
  - _self_

paths:
  project_root: ${oc.env:EASYCACHE_ROOT,.}
  checkpoint_dir: /path/to/Wan2.2-TI2V-5B
  output_root: /path/to/raw_wan_trajectories

data:
  prompt_file: /path/to/prompts.txt
  seeds_per_prompt: 1
  base_seed: 20260929

generation:
  task: ti2v-5B
  size: 1280*704
  frame_num: 121
  sample_steps: 50
  sample_solver: unipc
  sample_shift: 5.0
  sample_guide_scale: 5.0
  image: null
  offload_model: true
  convert_model_dtype: false
  t5_cpu: false

storage:
  # Every step stores raw x and raw model output y for both CFG branches.
  # The tensors retain the dtype and shape produced by Wan.
  shard_steps: 5

parallel:
  num_processes: auto

runtime:
  device_id: 0

hydra:
  run:
    dir: ${paths.output_root}/hydra/${oc.env:SLURM_JOB_ID,local}
  job:
    chdir: false
