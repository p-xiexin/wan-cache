project_root: ${oc.env:EASYCACHE_ROOT,../..}
experiment_root: ${oc.env:EVAL_OUTPUT_ROOT,eval/outputs/polynomial}
output_dir: ${experiment_root}/metrics/quality

origins:
  - ${experiment_root}/origin/0.mp4
  - ${experiment_root}/origin/1.mp4
  - ${experiment_root}/origin/2.mp4

targets:
  - method: easycache
    cache_threshold: 0.03
    videos:
      - ${experiment_root}/easycache_0.03/0.mp4
      - ${experiment_root}/easycache_0.03/1.mp4
      - ${experiment_root}/easycache_0.03/2.mp4
  - method: easycache
    cache_threshold: 0.05
    videos:
      - ${experiment_root}/easycache_0.05/0.mp4
      - ${experiment_root}/easycache_0.05/1.mp4
      - ${experiment_root}/easycache_0.05/2.mp4
  - method: easycache
    cache_threshold: 0.07
    videos:
      - ${experiment_root}/easycache_0.07/0.mp4
      - ${experiment_root}/easycache_0.07/1.mp4
      - ${experiment_root}/easycache_0.07/2.mp4
  - method: d2cache_output
    cache_threshold: 0.03
    videos:
      - ${experiment_root}/d2cache_output_0.03/0.mp4
      - ${experiment_root}/d2cache_output_0.03/1.mp4
      - ${experiment_root}/d2cache_output_0.03/2.mp4
  - method: d2cache_output
    cache_threshold: 0.05
    videos:
      - ${experiment_root}/d2cache_output_0.05/0.mp4
      - ${experiment_root}/d2cache_output_0.05/1.mp4
      - ${experiment_root}/d2cache_output_0.05/2.mp4
  - method: d2cache_output
    cache_threshold: 0.07
    videos:
      - ${experiment_root}/d2cache_output_0.07/0.mp4
      - ${experiment_root}/d2cache_output_0.07/1.mp4
      - ${experiment_root}/d2cache_output_0.07/2.mp4
  - method: polynomial
    cache_threshold: 0.03
    videos:
      - ${experiment_root}/polynomial_0.03/0.mp4
      - ${experiment_root}/polynomial_0.03/1.mp4
      - ${experiment_root}/polynomial_0.03/2.mp4
  - method: polynomial
    cache_threshold: 0.05
    videos:
      - ${experiment_root}/polynomial_0.05/0.mp4
      - ${experiment_root}/polynomial_0.05/1.mp4
      - ${experiment_root}/polynomial_0.05/2.mp4
  - method: polynomial
    cache_threshold: 0.07
    videos:
      - ${experiment_root}/polynomial_0.07/0.mp4
      - ${experiment_root}/polynomial_0.07/1.mp4
      - ${experiment_root}/polynomial_0.07/2.mp4

device: cuda:0
batch_size: 4
alexnet_path: ${oc.env:ALEXNET_PATH,/path/to/alexnet-owt-7be5be79.pth}
i3d_path: ${oc.env:I3D_PATH,/path/to/i3d_torchscript.pt}
fvd_num_frames: 16
fvd_frame_stride: 8
